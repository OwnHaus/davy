<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Davy - Issues (direction C, Instrument)</title>
<script>
(function () {
  var m = location.search.match(/[?&]theme=(light|dark)/);
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function set(dark) { document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); }
  set(m ? m[1] === 'dark' : mq.matches);
  if (!m && mq.addEventListener) mq.addEventListener('change', function (e) { set(e.matches); });
})();
</script>
<script src="data.js"></script>
<style>
/* Palette. Dark: olive-cast graphite. Light: crisp neutral white, graphite ink.
   One accent: verdigris. Contrast numbers checked with a node script (see report). */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --bg: #fcfcfb;
  --rail: #efefe9;
  --panel: #f4f4ef;
  --code: #f4f4ef;
  --btn: #e9eae2;
  --btn-hover: #dfe1d6;
  --line: #ecece6;
  --hover: #f1f3ee;
  --cursor: #d7ebe5;
  --sel: #e6f2ee;
  --ink: #1d1e1a;
  --muted: #54554d;
  --faint: #62635a;
  --accent: #17695a;
  --accent-ink: #ffffff;
  --lv-fatal: #a3302a;
  --lv-error: #a3302a;
  --lv-warning: #715b00;
  --lv-info: #54554d;
  --h0: #e4e6dd; --h1: #b0dbcd; --h2: #75bfab; --h3: #38977f; --h4: #1a7060; --h5: #0b463b;
  --tc0: #1d1e1a; --tc1: #1d1e1a; --tc2: #1d1e1a; --tc3: #10110e; --tc4: #ffffff; --tc5: #ffffff;
  --tip-bg: #1d1e1a; --tip-ink: #f4f4ee;
  --shadow: 0 1px 2px rgba(29, 30, 26, .22);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1b17;
  --rail: #151613;
  --panel: #22231e;
  --code: #151613;
  --btn: #2c2d26;
  --btn-hover: #373830;
  --line: #22231e;
  --hover: #242520;
  --cursor: #233a33;
  --sel: #1f2d28;
  --ink: #e8e7de;
  --muted: #b0afa2;
  --faint: #a3a295;
  --accent: #6cc6b1;
  --accent-ink: #10110e;
  --lv-fatal: #e5958a;
  --lv-error: #e5958a;
  --lv-warning: #cdbf7c;
  --lv-info: #b0afa2;
  --h0: #2a2b25; --h1: #2e5249; --h2: #3a7a68; --h3: #52a58f; --h4: #7ccbb4; --h5: #bdf0de;
  --tc0: #f4f4ee; --tc1: #f4f4ee; --tc2: #ffffff; --tc3: #10110e; --tc4: #10110e; --tc5: #10110e;
  --tip-bg: #e8e7de; --tip-ink: #1a1b17;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
.mono, code, kbd, pre, time.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

/* Shell */
.app { display: grid; grid-template-rows: 40px minmax(0, 1fr) 26px; height: 100vh; }
.top { display: flex; align-items: center; gap: 16px; background: var(--rail); padding: 0 16px 0 14px; }
.brand { display: flex; align-items: center; gap: 9px; width: 172px; font-weight: 650; font-size: 15px; letter-spacing: .01em; }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
.crumb b { color: var(--ink); font-weight: 600; }
.asof { margin-left: auto; color: var(--faint); font-size: 12px; }
.asof .mono { color: var(--muted); }
.body { display: grid; grid-template-columns: 188px minmax(0, 1fr) 312px; min-height: 0; }
.body.wide { grid-template-columns: 188px minmax(0, 1fr); }
.body.wide #insp { display: none; }
.foot { display: flex; align-items: center; gap: 18px; background: var(--rail); padding: 0 16px; color: var(--muted); font-size: 12px; }
.foot .sp { margin-left: auto; }
kbd { background: var(--btn); color: var(--ink); border-radius: 3px; padding: 0 5px; margin-right: 3px; font-size: 11px; line-height: 17px; display: inline-block; min-width: 17px; text-align: center; }

/* Rail */
#rail { background: var(--rail); padding: 6px 8px 10px; overflow: auto; display: flex; flex-direction: column; }
.rgroup { margin-top: 14px; }
.rgroup:first-child { margin-top: 6px; }
.rgroup h2 { margin: 0 0 3px; padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.rb { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; width: 100%; height: 26px; padding: 0 6px; border-radius: 4px; color: var(--ink); }
.rb:hover { background: var(--hover); }
.rb[aria-pressed="true"], .rb[aria-checked="true"] { background: var(--cursor); color: var(--ink); font-weight: 600; }
.rb .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.rb .dir { color: var(--accent); display: inline-flex; }
.rnote { padding: 2px 6px 0; font-size: 11.5px; color: var(--faint); }
.legend { margin-top: auto; padding: 14px 6px 0; }
.legend h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.legend .sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.legend .sw i { height: 10px; border-radius: 1px; }
.legend .lb { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin-top: 3px; font-size: 10.5px; color: var(--faint); text-align: center; white-space: nowrap; }
.legend .lb span { overflow: visible; }

/* Heat strip */
.s0 { background: var(--h0); color: var(--tc0); }
.s1 { background: var(--h1); color: var(--tc1); }
.s2 { background: var(--h2); color: var(--tc2); }
.s3 { background: var(--h3); color: var(--tc3); }
.s4 { background: var(--h4); color: var(--tc4); }
.s5 { background: var(--h5); color: var(--tc5); }
.strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.strip i { display: block; border-radius: 1px; position: relative; font-style: normal; }
.strip.sm { width: 166px; }
.strip.sm i { height: 14px; }
.strip.md i { height: 30px; }
.strip.lg i { height: 60px; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; }
.strip i.col { box-shadow: 0 0 0 1px var(--muted); z-index: 1; }
.strip i.on { box-shadow: 0 0 0 2px var(--ink); z-index: 2; }
.strip:focus-visible { outline-offset: 3px; }
.axis { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; margin-top: 4px; font-size: 11px; color: var(--faint); line-height: 13px; }
.axis span { justify-self: center; white-space: nowrap; text-align: center; }
.axis.lg { min-height: 28px; }
.axis.lg span.day { color: var(--muted); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 4px; padding: 5px 8px; box-shadow: var(--shadow); font-size: 12px; line-height: 1.35; opacity: 0; transition: opacity .08s; white-space: nowrap; }
#tip.show { opacity: 1; }
#tip .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
#tip b { font-weight: 650; font-size: 13px; }

/* Level + status marks */
.lv { display: inline-flex; align-items: center; gap: 6px; font-weight: 550; }
.lv-fatal { color: var(--lv-fatal); } .lv-error { color: var(--lv-error); }
.lv-warning, .lv-warn { color: var(--lv-warning); } .lv-info { color: var(--lv-info); }
.stt { display: inline-flex; align-items: center; gap: 6px; }
.st-unresolved { color: var(--ink); } .st-resolved { color: var(--muted); } .st-ignored { color: var(--muted); }
.reg { display: inline-flex; align-items: center; gap: 4px; color: var(--lv-warning); font-size: 11.5px; font-weight: 550; flex: none; margin-left: 8px; }

/* List view */
#vlist { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.tb { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; height: 46px; }
.search { position: relative; width: 320px; }
.search input { width: 100%; height: 30px; border: 0; border-radius: 5px; background: var(--panel); color: var(--ink); padding: 0 34px 0 10px; font: inherit; }
.search input::placeholder { color: var(--faint); opacity: 1; }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.search kbd { position: absolute; right: 7px; top: 6px; }
.tbr { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; }
.tbr .cnt { color: var(--ink); font-weight: 600; margin-right: 6px; }
.tscroll { overflow: auto; min-height: 0; }
table.iss { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
table.iss th { position: sticky; top: 0; z-index: 3; background: var(--bg); text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); height: 28px; padding: 0 6px; white-space: nowrap; box-shadow: 0 1px 0 var(--line); }
table.iss th.r, table.iss td.r { text-align: right; }
table.iss th button { font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 3px; margin: 0 -3px; border-radius: 3px; }
table.iss th.r button { flex-direction: row-reverse; }
table.iss th button:hover { color: var(--ink); }
table.iss th[aria-sort="ascending"] button, table.iss th[aria-sort="descending"] button { color: var(--accent); }
table.iss td { height: 30px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.iss td.chk, table.iss th.chk { padding: 0 0 0 14px; }
table.iss input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; vertical-align: middle; }
tr.row { cursor: default; position: relative; }
tr.row:hover td { background: var(--hover); }
tr.row.sel td { background: var(--sel); }
tr.row.cur td { background: var(--cursor); }
tr.row.cur td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.row.leaving { opacity: 0; transition: opacity .15s ease-out; }
td.title { display: table-cell; }
td.title .tt { display: flex; align-items: center; min-width: 0; }
td.title a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 500; }
td.title a:hover { text-decoration: underline; text-underline-offset: 2px; }
td.title a:focus-visible { outline-offset: 0; }
.pj { color: var(--muted); margin-right: 6px; }
.fn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
td.cul { color: var(--ink); }
td.rel { color: var(--muted); }
.dim { color: var(--faint); }
tr.row.done td.title a { color: var(--muted); font-weight: 400; }
.empty { padding: 40px 20px; color: var(--muted); }

/* Inspector */
#insp { background: var(--panel); overflow: auto; padding: 14px 16px 16px; min-height: 0; }
#insp h1 { font-size: 14.5px; line-height: 1.35; font-weight: 600; margin: 8px 0 6px; overflow-wrap: anywhere; }
#insp .meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#insp .sect { margin-top: 14px; }
#insp .sect > h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 5px; display: flex; justify-content: space-between; }
#insp .sect > h2 span { font-weight: 400; color: var(--faint); }
.frame-mini { background: var(--code); border-radius: 4px; padding: 8px 10px; }
.frame-mini .fh { display: flex; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.frame-mini .fh .mono { color: var(--muted); }
.frame-mini .fh b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
.cl { display: grid; grid-template-columns: 26px minmax(0, 1fr); margin-top: 6px; background: var(--cursor); border-radius: 3px; padding: 2px 6px 2px 0; }
.cl .no { text-align: right; padding-right: 8px; color: var(--accent); font-weight: 700; }
.cl .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
.frame-mini .org { margin-top: 6px; color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 12px; }
.frame-mini .org .mono { color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr); margin: 0; column-gap: 14px; }
.kv dt { color: var(--muted); padding: 2px 0; }
.kv dd { margin: 0; padding: 2px 0; overflow-wrap: anywhere; min-width: 0; }
.kv dd.mono, .kv dd .mono { font-size: 12px; }
.kv.tonal dt, .kv.tonal dd { padding: 3px 8px; }
.kv.tonal dt:nth-of-type(odd), .kv.tonal dd:nth-of-type(odd) { background: var(--panel); }
.cnt2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.cnt2 .big { font-size: 20px; font-weight: 600; line-height: 1.1; }
.cnt2 .lab { color: var(--muted); font-size: 12px; }
.acts { display: flex; gap: 6px; row-gap:10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 4px; background: var(--btn); color: var(--ink); font-weight: 500; white-space: nowrap; transition: background-color .1s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { color: var(--faint); cursor: default; background: transparent; }
.btn.agent { color: var(--accent); font-weight: 600; }
.btn kbd { margin: 0 -2px 0 2px; background: transparent; color: var(--muted); min-width: 0; padding: 0 2px; }
.btn:hover:not(:disabled) kbd { color: var(--ink); }
.link { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; margin-left: auto; }
.link:hover { text-decoration: underline; text-underline-offset: 2px; }
.hint { color: var(--faint); font-size: 12px; }
.peak { color: var(--muted); font-size: 12px; margin-top: 6px; }

/* Issue page */
#vissue { overflow: auto; min-width: 0; min-height: 0; padding: 16px 24px 40px 24px; }
.ihead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
.ihead h1 { margin: 6px 0 4px; font-size: 20px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; max-width: 900px; }
.ihead .sub { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; color: var(--muted); }
.ihead .sub .fn { color: var(--ink); }
.ihead .tags { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.iacts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; position: relative; padding-top: 2px; }
.pop { position: absolute; right: 0; top: 36px; z-index: 20; background: var(--panel); border-radius: 6px; padding: 12px; width: 300px; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); text-align: left; }
.pop label { display: block; font-weight: 600; margin-bottom: 6px; }
.pop input { width: 100%; height: 30px; border: 0; border-radius: 4px; background: var(--bg); color: var(--ink); padding: 0 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.pop .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.sumrow { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 18px; }
.panel { background: var(--panel); border-radius: 6px; padding: 12px 14px 14px; min-width: 0; }
.panel > h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel > h2 span { font-weight: 400; color: var(--muted); font-size: 12px; }
.evbar { display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; min-height: 32px; }
.evbar h2 { margin: 0; font-size: 15px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.evmeta { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; color: var(--muted); align-items: center; }
.evmeta .mono { color: var(--ink); }
.evmeta .c { display: inline-flex; align-items: center; gap: 6px; }
.cp { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 3px; color: var(--muted); }
.cp:hover { background: var(--btn); color: var(--ink); }
.evnote { margin-top: 6px; color: var(--faint); font-size: 12px; max-width: 900px; }
.evgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; margin-top: 14px; align-items: start; }
.sec { margin-bottom: 22px; }
.sec > h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.sec > h3 span { font-weight: 400; color: var(--muted); font-size: 12px; }
.exc { margin: 0 0 10px; }
.exc .ty { font-weight: 650; font-size: 14.5px; }
.exc .va { overflow-wrap: anywhere; font-size: 14.5px; }
.exc .mech { color: var(--muted); font-size: 12px; margin-top: 3px; }
.frame { background: var(--code); border-radius: 5px; margin-bottom: 4px; }
.frame.mine { margin-bottom: 8px; }
.fbtn { display: grid; grid-template-columns: 14px minmax(0, auto) minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 30px; padding: 4px 10px; border-radius: 5px; }
.fbtn:hover { background: var(--hover); }
.fbtn .chev { color: var(--muted); transition: transform .14s ease-out; }
.frame.open .fbtn .chev { transform: rotate(90deg); }
.fbtn .fnm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.frame:not(.mine) .fnm { font-weight: 400; color: var(--muted); }
.fbtn .loc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.fbtn .fl { display: inline-flex; gap: 14px; color: var(--muted); font-size: 12px; align-items: center; justify-self: end; }
.fbtn .fl .inapp { color: var(--accent); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .14s ease-out; }
.frame.open .fold { grid-template-rows: 1fr; }
.fold > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .14s; }
.frame.open .fold > div { visibility: visible; transition-delay: 0s; }
.org2 { padding: 0 10px 6px 34px; color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.org2 .mono { color: var(--ink); }
.code { padding: 4px 0 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
.ln { display: grid; grid-template-columns: 52px minmax(0, 1fr); }
.ln .no { text-align: right; padding-right: 14px; color: var(--faint); user-select: none; }
.ln .tx { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 12px; color: var(--muted); }
.ln.hit { background: var(--cursor); }
.ln.hit .no { color: var(--accent); font-weight: 700; }
.ln.hit .tx { color: var(--ink); }
.ln.hit .no::before { content: ""; display: inline-block; width: 6px; height: 9px; margin-right: 6px; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.fmeta { padding: 2px 10px 10px 34px; }
.rowlist { display: grid; }
.rl { display: grid; gap: 10px; align-items: baseline; padding: 4px 8px; border-radius: 3px; }
.rl:nth-child(odd) { background: var(--panel); }
.rl.bc { grid-template-columns: 96px 70px 78px minmax(0, 1fr); }
.rl.lg { grid-template-columns: 96px 66px 100px minmax(0, 1fr); }
.rl .t { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.rl .c { color: var(--muted); }
.rl .m { overflow-wrap: anywhere; min-width: 0; }
.rl .at { display: block; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; margin-top: 1px; }
.side .sec { margin-bottom: 18px; }
.none { color: var(--muted); }
.aside-note { margin-top: 14px; color: var(--muted); }
#live { position: absolute; left: -9999px; }
@media (max-width: 1240px) { .body { grid-template-columns: 172px minmax(0, 1fr) 280px; } .body.wide { grid-template-columns: 172px minmax(0, 1fr); } .evgrid, .sumrow { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">

      var s = h('section', { class: 'sec' }, h('h3', null, 'Exception', h('span', { text: 'crash-nearest frame first' })));
      s.appendChild(h('div', { class: 'exc' },
        h('div', null, h('span', { class: 'ty', text: ex.type + ': ' }), h('span', { class: 'va', text: ex.value })),
        h('div', { class: 'mech', text: 'mechanism ' + ex.mechanism.type + ', ' + (ex.mechanism.handled ? 'handled' : 'unhandled') })));
      var frames = ex.frames.map(function (f, k) { return { f: f, k: k }; }).reverse();
      var folded = frames.filter(function (x) { return !x.f.in_app; }).length;
      frames.forEach(function (x) { s.appendChild(frameEl(x.f, id + ':' + idx + ':' + x.k, !!x.f.in_app, x.f.symbolicated_from)); });
      main.appendChild(s);
    });
    var bc = h('section', { class: 'sec' }, h('h3', null, 'Breadcrumbs', h('span', { text: String(ev.breadcrumbs.length) })));
    if (!ev.breadcrumbs.length) bc.appendChild(h('div', { class: 'none', text: 'No breadcrumbs on this event.' }));
    else { var rl = h('div', { class: 'rowlist' }); ev.breadcrumbs.forEach(function (b) { rl.appendChild(h('div', { class: 'rl bc' }, h('span', { class: 't', text: fmtClock(b.at) }), h('span', { class: 'c', text: b.category }), lvl(b.level), h('span', { class: 'm', text: b.message }))); }); bc.appendChild(rl); }

    if (id === 14 && D.logs) {
      var lg = h('section', { class: 'sec' }, h('h3', null, 'Logs around the event', h('span', { text: D.logs.length + ' lines' })));
      var ll = h('div', { class: 'rowlist' });

      });
      lg.appendChild(ll); main.appendChild(lg);
    }

    var tags = h('section', { class: 'sec' }, h('h3', null, 'Tags', h('span', { text: String(Object.keys(ev.tags).length) })), kvGrid(ev.tags));
    var ctx = Object.assign({}, ev.contexts, { platform: ev.platform, 'server name': ev.server });
    var cx = h('section', { class: 'sec' }, h('h3', null, 'Contexts', h('span', { text: String(Object.keys(ctx).length) })), kvGrid(ctx));
    var usr = h('section', { class: 'sec' }, h('h3', null, 'User and trace'));
    var ukv = h('dl', { class: 'kv tonal' }, h('dt', { text: 'User id' }), h('dd', { class: ev.user && ev.user.id ? 'mono' : 'none', text: ev.user && ev.user.id ? ev.user.id : 'not set' }),
      h('dt', { text: 'Trace id' }), h('dd', null, ev.trace_id ? h('span', { class: 'mono', text: ev.trace_id }) : h('span', { class: 'none', text: 'not set' }), ev.trace_id ? copyBtn(ev.trace_id, 'trace id') : null),
      h('dt', { text: 'Request' }), h('dd', { class: 'none', text: ev.request ? 'present' : 'none on this event' }));
    usr.appendChild(ukv);
    side.appendChild(tags); side.appendChild(cx); side.appendChild(usr);
    elIssue.appendChild(h('div', { class: 'evgrid' }, main, side));
  }

  /* ---------- footer, crumb ---------- */
  function renderChrome(r) {
    clear(elCrumb);
    if (r.kind === 'list') elCrumb.appendChild(h('b', { text: 'Issues' }));
    else { elCrumb.appendChild(h('a', { href: '#/issues', style: 'color:var(--muted)', text: 'Issues' })); elCrumb.appendChild(ico('fwd', 11)); elCrumb.appendChild(h('b', { class: 'mono', style: 'font-size:13px', text: '#' + r.id })); }
    clear(elFoot);
    var keys = r.kind === 'list' ? [['j', 'k', 'move'], ['Enter', null, 'open'], ['x', null, 'select'], ['r', null, 'resolve'], ['i', null, 'ignore'], ['o', null, 'reopen'], ['/', null, 'search']] : [['r', null, 'resolve'], ['i', null, 'ignore'], ['o', null, 'reopen'], ['[', ']', 'event'], ['Esc', null, 'back to list']];
    keys.forEach(function (k) { elFoot.appendChild(h('span', null, h('kbd', { text: k[0] }), k[1] ? h('kbd', { text: k[1] }) : null, k[2])); });
    if (r.kind === 'list') elFoot.appendChild(h('span', { class: 'sp', text: 'Heat strips use one scale for every row' }));
  }

  /* ---------- main render ---------- */
  function render() {
    var active = document.activeElement, key = active && active.getAttribute && active.getAttribute('data-k');
    var r = route();
    elBody.classList.toggle('wide', r.kind === 'issue');
    elList.hidden = r.kind !== 'list'; elIssue.hidden = r.kind !== 'issue';
    renderRail(); renderChrome(r);
    if (r.kind === 'list') renderList(); else { var top = elIssue.scrollTop; renderIssue(r.id); elIssue.scrollTop = top; }
    document.title = r.kind === 'list' ? 'Issues - Davy' : 'Issue ' + r.id + ' - Davy';
    if (key) { var n = document.querySelector('[data-k="' + key + '"]'); if (n && n !== document.activeElement) n.focus(); }
  }
  window.addEventListener('hashchange', function () { st.pop = false; var r = route(); if (r.kind === 'issue') { elIssue.scrollTop = 0; st.cursor = r.id; } render(); if (r.kind === 'list') scrollRow(); });
  function scrollRow() { var c = elTbody.querySelector('tr.cur'); if (c) c.scrollIntoView({ block: 'nearest' }); }

  elQ.addEventListener('input', function () { st.q = elQ.value.trim(); render(); });
  elQ.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (elQ.value) { elQ.value = ''; st.q = ''; render(); } else elQ.blur(); e.stopPropagation(); }
    if (e.key === 'Enter' || e.key === 'ArrowDown') { elQ.blur(); e.preventDefault(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' && t.type !== 'checkbox' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var r = route(), k = e.key;
    if (k === '/') { if (r.kind !== 'list') { go('#/issues'); } setTimeout(function () { elQ.focus(); elQ.select(); }, 0); e.preventDefault(); return; }
    if (r.kind === 'list') {
      var v = visible().filter(function (i) { return !st.leaving.has(i.id); });
      var at = v.findIndex(function (i) { return i.id === st.cursor; });
      if (k === 'j' || k === 'k' || k === 'ArrowDown' && !t.closest('select') && tag !== 'BUTTON' || k === 'ArrowUp' && tag !== 'BUTTON') {
        var d = (k === 'j' || k === 'ArrowDown') ? 1 : -1;
        var n = Math.max(0, Math.min(v.length - 1, at + d));
        if (v.length) { st.cursor = v[n].id; scrollToCursor = true; renderList(); }
        e.preventDefault();
      } else if (k === 'Enter' && !(t.closest && t.closest('a, button'))) { if (st.cursor != null) { go('#/issues/' + st.cursor); e.preventDefault(); } }
      else if (k === 'x' || k === ' ' && tag === 'TR') { if (st.cursor != null) { if (st.sel.has(st.cursor)) st.sel.delete(st.cursor); else st.sel.add(st.cursor); render(); } e.preventDefault(); }
      else if (k === 'r' || k === 'i' || k === 'o') {
        var ids = st.sel.size ? Array.from(st.sel) : (st.cursor != null ? [st.cursor] : []);
        act(ids, k === 'r' ? 'resolved' : k === 'i' ? 'ignored' : 'unresolved');
      } else if (k === 'Escape') { if (st.sel.size) { st.sel.clear(); render(); } }
    } else {
      if (k === 'Escape') { if (st.pop) { st.pop = false; renderIssue(r.id); } else go('#/issues'); e.preventDefault(); }
      else if (k === 'r' || k === 'i' || k === 'o') act([r.id], k === 'r' ? 'resolved' : k === 'i' ? 'ignored' : 'unresolved');
      else if (k === '[' || k === ']') {
        var evs = D.events[r.id] || [], cur = st.evIdx[r.id] || 0, nx = cur + (k === '[' ? 1 : -1);
        if (nx >= 0 && nx < evs.length) { st.evIdx[r.id] = nx; renderIssue(r.id); }
      }
    }
  });

  /* ---------- boot ---------- */
  var r0 = route();
  if (r0.kind === 'issue') st.cursor = r0.id;
  render();
})();

[package]
name = "obs-bench"
version = "0.0.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
tantivy = { version = "0.27", features = ["zstd-compression"] }
rand = { version = "0.8", features = ["small_rng"] }
libc = "0.2"
zstd = "0.13"

[profile.release]
debug = 1

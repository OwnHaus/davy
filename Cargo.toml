[package]
name = "davy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.43", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
flate2 = "1"
brotli = "8"
clap = { version = "4", features = ["derive", "env"] }
blake3 = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
anyhow = "1"
tantivy = { version = "0.27", features = ["zstd-compression"] }
rmpv = "1.3.1"
prost = "0.14.6"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["logs", "gen-tonic-messages", "with-serde"] }
base64 = "0.23.1"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Mechanical rules live here, not in AGENTS.md. Never loosen a lint to get a
# change through; fix the code or use #[expect(lint, reason = "...")].
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
mem_forget = "deny"
exit = "deny"
rc_buffer = "warn"
cognitive_complexity = "warn"

[package]
name = "davy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
flate2 = "1"
brotli = "8"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
anyhow = "1"
tantivy = { version = "0.27", features = ["zstd-compression"] }
rmpv = "1.3.1"
prost = "0.14.6"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["logs", "gen-tonic-messages", "with-serde"] }
base64 = "0.23.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

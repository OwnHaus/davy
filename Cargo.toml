[package]
name = "davy"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
homepage = "https://ownhaus.dev/davy/"
repository = "https://github.com/OwnHaus/davy"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "original-uri"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.43", features = ["bundled", "functions", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
flate2 = "1"
http-body-util = "0.1"
brotli-decompressor = "6"
clap = { version = "4", features = ["derive", "env"] }
blake3 = "1"
regex = "1"
memchr = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
anyhow = "1"
tantivy = { version = "0.27", features = ["zstd-compression"] }
rmpv = "1.3.1"
prost = "0.14.6"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["logs", "gen-tonic-messages", "with-serde"] }
base64 = "0.23.1"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
sourcemap = "9.3.2"
sha1 = "0.11.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
argon2 = "0.6"
crossbeam-channel = "0.5"
unicode-normalization = { version = "0.1", default-features = false }
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["dir", "fs", "user"] }

[dev-dependencies]
brotli = "9"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
futures = "0.3"
peak_alloc = "0.3"
ts-rs = { version = "12", features = ["serde-json-impl"] }

# Its tests check the arguments the benchmark refuses.
[[example]]
name = "error_footprint"
test = true

# Mechanical rules live here, not in AGENTS.md. Never loosen a lint to get a
# change through; fix the code or use #[expect(lint, reason = "...")].
# Argon2 at opt-level 0 takes seconds per hash, which the login tests would
# feel. Only these crates are optimized in dev builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# File and line for Davy's own frames in the backtrace of a crash Davy
# records of itself, see "Self-monitoring" in docs/design.md. Line tables
# only, not types, and of the davy crate only: those of std and the
# dependencies made the Linux binary 192 MB. scripts/build-release
# compresses them on Linux and leaves them out on macOS.
[profile.release]
debug = "line-tables-only"
[profile.release.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
mem_forget = "deny"
exit = "deny"
rc_buffer = "warn"
cognitive_complexity = "warn"

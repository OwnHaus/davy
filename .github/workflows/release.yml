name: release

# A tag vX.Y.Z builds the binaries, the SBOMs and the image, attests and signs
# them and opens a draft release. A tag vX.Y.Z-suffix is a test run and its
# draft is a prerelease. RELEASING.md describes the steps around it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No cache: a release builds from the tag alone, so nothing an earlier run
# left behind can end up in it.
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version in Cargo.toml
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          case $GITHUB_REF_NAME in
            "$want" | "$want"-*) ;;
            *) echo "::error::the tag $GITHUB_REF_NAME does not match $want in Cargo.toml"; exit 1 ;;
          esac
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.10,cargo-auditable@0.7.7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The binary embeds the UI from ui/dist, so it is built first.
      - run: scripts/ui
      - run: scripts/build-release "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # The only job that can write.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the draft release
      packages: write # the image on ghcr.io
      id-token: write # Sigstore signatures and attestations
      attestations: write # build provenance
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum davy-* > SHA256SUMS && cat SHA256SUMS
      # GitHub keeps attestations only for public repositories, and Sigstore
      # logs every signature in public, which would name a private repository.
      # A test tag in a private repository is therefore unsigned.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/davy-*
      - if: ${{ !github.event.repository.private }}
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cosign
      - id: image
        name: Image
        run: |
          version=${GITHUB_REF_NAME#v}
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          mkdir -p dist/image/amd64 dist/image/arm64 dist/image/data
          cp dist/davy-x86_64-unknown-linux-musl dist/image/amd64/davy
          cp dist/davy-aarch64-unknown-linux-musl dist/image/arm64/davy
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          tags=(-t "$repo:$version")
          case $version in *-*) ;; *) tags+=(-t "$repo:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --metadata-file meta.json "${tags[@]}" --push .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          echo "image=$repo:$version" >> "$GITHUB_OUTPUT"
          [ "$PRIVATE" = false ] || exit 0
          cosign sign --yes "$repo@$digest"
          for arch in amd64 arm64; do
            case $arch in amd64) target=x86_64-unknown-linux-musl ;; arm64) target=aarch64-unknown-linux-musl ;; esac
            platform=$(docker buildx imagetools inspect --raw "$repo@$digest" |
              jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            cosign attest --yes --type cyclonedx --predicate "dist/davy-$target.cdx.json" "$repo@$platform"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
      - name: Draft release
        run: |
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          section() { awk -v h="$1" '/^## / { if (on) exit; on = (index($0, h) == 1); next } on' CHANGELOG.md; }
          section "## $base (" > notes.md
          flags=(--draft)
          [ "$PRIVATE" = false ] || case $version in *-*) ;; *)
            echo "::error::a release needs a public repository, for its attestations and signatures"; exit 1
          ;; esac
          case $version in *-*)
            flags+=(--prerelease)
            [ -s notes.md ] || section "## Unreleased" > notes.md
          ;; esac
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $base"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --verify-tag \
            --title "Davy $version" --notes-file notes.md dist/davy-* dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
      # The verify job cannot see a draft without write access, so it gets
      # the same files this way.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/davy-*
            dist/SHA256SUMS
          if-no-files-found: error

  # Checks the release files and the image the way RELEASING.md asks a user
  # to. The owner repeats it against the draft itself before publishing.
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # the checkout
      packages: read # the image
      attestations: read # the provenance of each binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cosign,cargo-audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          flags=()
          [ "$PRIVATE" = false ] || flags=(--unsigned)
          scripts/verify-release "${flags[@]}" "$GITHUB_REF_NAME" release
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium --only-shell
        working-directory: e2e
      - name: e2e against the release binary
        run: |
          chmod +x release/davy-x86_64-unknown-linux-musl
          DAVY_BIN=release/davy-x86_64-unknown-linux-musl bash e2e/run.sh
      - name: e2e against the image
        run: DAVY_BIN=e2e/davy-image bash e2e/run.sh
        env:
          DAVY_IMAGE: ${{ needs.publish.outputs.image }}

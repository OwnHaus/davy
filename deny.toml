# Dependency policy, checked by `cargo deny check` in scripts/check and CI.
# Davy is AGPL-3.0-only and the closed davy-cloud crate links it, so every
# dependency must be permissive or weak copyleft.

[graph]
all-features = false

[advisories]
yanked = "deny"
# Each ignore names one advisory and why it cannot be fixed here yet.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable. Only rmcp and schemars pull it in, as a hard dependency. Davy's own time code uses jiff. Drop this when rmcp moves off chrono." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "davy" },
    # Mozilla's root certificates as data. A permissive data license, allowed
    # for this one crate only.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Tests talk to real servers on loopback and real files, never to mocks.
deny = [
    { crate = "mockall", reason = "tests use real servers and files" },
    { crate = "mockito", reason = "tests use real servers and files" },
    { crate = "wiremock", reason = "tests use real servers and files" },
    { crate = "httpmock", reason = "tests use real servers and files" },
    { crate = "faux", reason = "tests use real servers and files" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

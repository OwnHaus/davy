# Dependency policy, checked by `cargo deny check` in scripts/check and CI.
# Davy is AGPL-3.0-only and the closed davy-cloud crate links it, so every
# dependency must be permissive or weak copyleft.

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [{ allow = ["AGPL-3.0-only"], crate = "davy" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
